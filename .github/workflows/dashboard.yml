name: Actualizar dashboard

on:
  schedule:
    # GitHub acepta como mínimo 5 min; en la práctica puede tardar 5-15 min.
    # No es tiempo real: para eso usa la Function URL (ver infra/api/DEPLOY-CONSOLE.md).
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      HAS_AWS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        if: env.AWS_ROLE_ARN != '' || env.HAS_AWS_KEYS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Credenciales AWS (OIDC, sin claves permanentes)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-west-1

      - name: Dependencias
        if: env.AWS_ROLE_ARN != '' || env.HAS_AWS_KEYS == 'true'
        run: npm ci

      - name: Leer DynamoDB (OIDC)
        if: env.AWS_ROLE_ARN != ''
        run: node scripts/fetch.mjs
        env:
          TABLE_NAME: LecturaSensor
          AWS_REGION: us-west-1

      - name: Leer DynamoDB (claves de AWS Academy / IAM)
        if: env.AWS_ROLE_ARN == '' && env.HAS_AWS_KEYS == 'true'
        run: node scripts/fetch.mjs
        env:
          TABLE_NAME: LecturaSensor
          AWS_REGION: us-west-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
